name: Tests

# The suite ran nowhere. The nightly workflow gates on tests/test_parity.py and
# scripts/validate_ledger.py, both written to run standalone so a missing package can
# never break the ledger commit — a deliberate choice, and the reason the other 300-odd
# tests had no runner at all. They were executed by whoever remembered to.
#
# This is a separate workflow on purpose. It installs pytest, which the nightly must
# never depend on: an install failure here fails a pull request, which is what it is for,
# and cannot fail the job that writes the ledger.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # node is required by the parity gate, which executes the terminal's own scoring
      # block rather than a transcription of it. Without node that gate reports a skip
      # under pytest — so it is installed here, and the standalone run below treats a
      # missing node as a failure rather than a pass.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # tests/test_render.py drives a real browser. It is the only gate that can answer
      # the two questions the source-reading gates cannot: whether the factor
      # decomposition reconstructs the published score for every row on the board rather
      # than for the rows someone checked, and whether a tap on a phone actually opens an
      # explanation. The second of those caught a real bug that reads correctly in the
      # source - browsers replay a synthetic mouseout after every tap, which dismissed the
      # popover before it could be read.
      #
      # continue-on-error is deliberately NOT set: a render failure is a broken board.
      # The test skips itself when playwright or a browser is missing, so an environment
      # without one reports a skip rather than a pass it did not earn.
      - name: Install playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run the suite
        run: python -m pytest tests/ -q

      - name: Label engine gate, standalone
        # Same dual-mode shape as the parity gate below, and for the same reason: the
        # block it executes is extracted from index.html, so editing the chart JS alone
        # cannot leave this green. A missing node is a FAILURE here rather than a skip.
        run: python tests/test_labels.py

      - name: Workspace layout gate, standalone
        # The four-screen nav wraps the entire existing terminal. The break it guards
        # against — a wrapper that is not display:contents — collapses the three-column
        # grid and de-activates every grid-column rule in the file, and it passes every
        # other source-reading gate here because those read the CSS text rather than the
        # render.
        run: python tests/test_workspaces.py

      - name: RWA model gate, standalone
        # Runs here as well as under pytest above, for the same reason the parity gate
        # does: this path has its own entrypoint and a green pytest run does not prove
        # the standalone one still works. The property it holds that nothing else can —
        # the residual IS the change in units outstanding, exactly — is the one the whole
        # module rests on, and its failure mode is numbers rather than exceptions.
        run: python tests/test_rwa.py

      - name: Parity gate, standalone
        # Also run the way the nightly runs it, because that path has its own
        # entrypoint and its own failure semantics, and a green pytest run does not
        # prove the standalone one still works.
        run: python tests/test_parity.py

      - name: Contract specification gate, standalone
        # The multiplier table is inlined in index.html and lives on disk in
        # contract_specs.json. Generated copies are only safe when a drift between them
        # is a test failure rather than a discovery six months later.
        run: python tests/test_contract_specs.py

      - name: Contrast gate, standalone
        # Walks the real delta ramp under node and fails below 4.5:1. The ramp it
        # replaced rendered every negative value on the board below AA while large
        # positives cleared it threefold, which on a risk tool is a thumb on the scale.
        run: python tests/test_contrast.py

      - name: Explanation-layer gate, standalone
        run: python tests/test_a11y.py

      - name: Drawer gate, standalone
        # Opens every drawer the board can render, by pointer and by keyboard, on a
        # desktop and on a phone. It exists because issue #28 came back through a gate
        # that opened ONE drawer: a throw inside an onclick goes nowhere, so the header
        # rendered, the body did not, and nothing surfaced. A loop over the first screen
        # is not a loop over the board.
        run: python tests/test_drawer.py

      - name: ATR eligibility gate, standalone
        # Runs here as well as in the nightly, because it guards two things that change
        # in different places: the recorded ledger (nightly) and the code that reads and
        # renders it (here). A pull request that drops the observation date from the
        # rendered stop breaks the provenance half of the invariant without touching any
        # data at all.
        run: python tests/test_atr_eligibility.py
